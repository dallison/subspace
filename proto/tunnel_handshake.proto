// The first packet on every tunnel TCP connection carries a Handshake that
// describes the channel the connection feeds.  The field numbers are part of
// the tunnel wire format and must not change; the names are local.
syntax = "proto3";

package subspace.tunnel;

message SubspaceTransport {
  uint64 slot_size = 1;
  uint32 num_slots = 2;
  bool is_reliable = 3;
  string mux = 4;
  int32 vchan_id = 5;
  optional int32 checksum_size = 6;  // Absent means 4.
  int32 metadata_size = 7;
}

message Handshake {
  string topic_name = 1;
  bytes channel_type = 2;
  oneof transport {
    SubspaceTransport subspace = 4;
  }
}
